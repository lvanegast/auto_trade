version: "3.3"

services:
  db_trading:
    image: postgres:16-alpine
    container_name: trading_bot_db
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
      POSTGRES_DB: trading_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata_trading:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trading_bot_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db_trading
      - DATABASE_CLEANUP_STARTUP=true
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - .env:/app/.env
      - ./web:/app/web
      - ./backend/scripts:/app/scripts
    depends_on:
      - db_trading
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  pgdata_trading:
