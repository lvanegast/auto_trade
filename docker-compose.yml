services:
  db_trading:
    image: postgres:16-alpine
    container_name: trading_bot_db
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
      POSTGRES_DB: trading_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata_trading:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trading_bot_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db_trading
      - DATABASE_CLEANUP_STARTUP=true
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - .env:/app/.env
      - ./web:/app/web
      - ./backend/scripts:/app/scripts
      - C:\Users\User\Downloads\kalshi_private_key.pem:/app/kalshi_private_key.pem
      - C:\Users\User\Downloads\arb.pem:/app/arb.pem
    depends_on:
      db_trading:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  pgdata_trading:
