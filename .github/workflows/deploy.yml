name: Deploy to Jetson Nano

on:
  push:
    branches:
      - feat/executable-arbitrage-engine
      - main

jobs:
  deploy:
    name: Auto-Deploy to Jetson
    runs-on: self-hosted
    steps:
      - name: Pull latest code and restart backend
        run: |
          cd ~/Documents/auto_trade
          git pull origin $(git rev-parse --abbrev-ref HEAD)
          docker restart trading_bot_backend
