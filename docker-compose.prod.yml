version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trading_bot_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading_password}
      POSTGRES_DB: ${DB_NAME:-trading_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - .env:/app/.env
      - /app/kalshi_private_key.pem:/app/kalshi_private_key.pem
    environment:
      - AUTO_START=true

volumes:
  postgres_prod_data:
